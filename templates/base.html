<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="{{ url_for('static', filename='https://fonts.googleapis.com') }}">
    <link rel="preconnect" href="{{ url_for('static', filename='https://fonts.gstatic.com') }}" crossorigin>
    <link href="{{ url_for('static', filename='https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap') }}" rel="stylesheet">
    <script src= "{{ url_for('static', filename='https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4') }}"></script>
    <title>{% block title %}Terrazzo{% endblock %}</title>
</head>
<body>
  <header class="flex flex-col gap-4 p-4 md:flex-row md:justify-between md:items-center"> 
    <figure>
        <img class="logo" src="Imagens\logo.png" alt="Logo do Terrazzo">
    </figure>
    <nav class="navegacao">
        <a href="{{ url_for('main.index.html') }}" class="font-[Oswald] text-xl font-light text-[#40846D] 
        transition-all duration-300 ease-in-out
        hover:text-[#285C4A] 
        hover:-translate-y-0.5 border-b-2 border-transparent hover:border-[#40846D] focus:outline-none focus:ring-2 focus:ring-[#285C4A]">Home</a>
        <a href="{{ url_for('about.html') }}" class="font-[Oswald] text-xl font-light text-[#40846D] 
        transition-all duration-300 ease-in-out
        hover:text-[#285C4A] 
        hover:-translate-y-0.5 border-b-2 border-transparent hover:border-[#40846D] focus:outline-none focus:ring-2 focus:ring-[#285C4A]">Sobre</a>
        <a href="{{ url_for('main.contact.html') }}" class="font-[Oswald] text-xl font-light text-[#40846D] 
        transition-all duration-300 ease-in-out
        hover:text-[#285C4A] 
        hover:-translate-y-0.5 border-b-2 border-transparent hover:border-[#40846D] focus:outline-none focus:ring-2 focus:ring-[#285C4A]">Contato</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
    </footer>
</body>
</html>
